<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Quorum graph screen mock">
  <title>Quorum graph view — full-screen RFC knowledge graph with node detail sidebar</title>

  <defs>
    <style>
      .canvas { fill: #ffffff; stroke: #e5e7eb; }
      .chrome { fill: #f8fafc; stroke: #e2e8f0; }
      .pane   { fill: #f8fafc; stroke: #e2e8f0; }
      .sidebar { fill: #ffffff; stroke: #e2e8f0; }
      .chip   { fill: #ffffff; stroke: #cbd5e1; }
      .chip-active { fill: #fff7ed; stroke: #ea580c; }
      .text-h     { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; }
      .text-body  { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; }
      .text-muted { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10.5px; }
      .text-label { fill: #ea580c; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.12em; }
      .text-chip { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 500; }
      .text-chip-active { fill: #ea580c; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; }
      .h-label { fill: #ea580c; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; }
      .h-title { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 22px; font-weight: 600; }
      .h-sub   { fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; }
      .edge   { stroke: #cbd5e1; stroke-width: 1.25; fill: none; }
      .edge-strong { stroke: #ea580c; stroke-width: 2; fill: none; }
      .node-fill-decision { fill: #ea580c; }
      .node-fill-alt   { fill: #38bdf8; }
      .node-fill-trade { fill: #a78bfa; }
      .node-fill-const { fill: #facc15; }
      .node-fill-comp  { fill: #34d399; }
      .node-fill-fail  { fill: #fb7185; }
      .node-fill-stake { fill: #94a3b8; }
      .node-stroke { stroke: #ffffff; stroke-width: 1.5; }
      .node-selected { stroke: #ea580c; stroke-width: 2.5; }
      .node-label { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10.5px; font-weight: 500; }
    </style>
  </defs>

  <rect class="canvas" x="0.5" y="0.5" width="1279" height="719" rx="12"/>

  <text class="h-label" x="40" y="44">WORKSPACE — GRAPH</text>
  <text class="h-title" x="40" y="74">Full-screen view of the RFC knowledge graph</text>
  <text class="h-sub"   x="40" y="98">Drag nodes, toggle edge labels, click any node to inspect its attributes and jump straight into a reviewer chat.</text>

  <!-- chrome -->
  <rect class="chrome" x="40" y="124" width="1200" height="48" rx="8"/>
  <text class="text-h"     x="56" y="153">Quorum — Adopt PostgreSQL over MongoDB</text>
  <text class="text-muted" x="980" y="153">Workbench · Graph · Agents · New project</text>

  <!-- filters bar -->
  <rect class="pane" x="40" y="184" width="900" height="40" rx="8"/>
  <text class="text-label" x="56" y="208">FILTERS</text>
  <g transform="translate(112,194)">
    <rect class="chip-active" x="0.5" y="0.5" width="74" height="22" rx="11"/>
    <text class="text-chip-active" x="14" y="16">All types</text>
    <rect class="chip" x="84.5" y="0.5" width="80" height="22" rx="11"/>
    <text class="text-chip" x="98" y="16">Decision</text>
    <rect class="chip" x="172.5" y="0.5" width="92" height="22" rx="11"/>
    <text class="text-chip" x="186" y="16">Alternative</text>
    <rect class="chip" x="272.5" y="0.5" width="80" height="22" rx="11"/>
    <text class="text-chip" x="286" y="16">Tradeoff</text>
    <rect class="chip" x="360.5" y="0.5" width="88" height="22" rx="11"/>
    <text class="text-chip" x="374" y="16">Constraint</text>
    <rect class="chip" x="456.5" y="0.5" width="74" height="22" rx="11"/>
    <text class="text-chip" x="470" y="16">Reviewer</text>
  </g>

  <!-- graph canvas (big) -->
  <rect class="pane" x="40" y="232" width="900" height="448" rx="8"/>

  <!-- edges -->
  <g class="edge">
    <line x1="480" y1="460" x2="240" y2="320"/>
    <line x1="480" y1="460" x2="330" y2="580"/>
    <line x1="480" y1="460" x2="700" y2="320"/>
    <line x1="480" y1="460" x2="760" y2="540"/>
    <line x1="480" y1="460" x2="480" y2="620"/>
    <line x1="240" y1="320" x2="170" y2="430"/>
    <line x1="700" y1="320" x2="820" y2="430"/>
    <line x1="240" y1="320" x2="170" y2="270"/>
    <line x1="700" y1="320" x2="820" y2="270"/>
    <line x1="330" y1="580" x2="480" y2="620"/>
    <line x1="760" y1="540" x2="480" y2="620"/>
    <line x1="240" y1="320" x2="330" y2="580"/>
    <line x1="700" y1="320" x2="760" y2="540"/>
  </g>

  <!-- highlighted edges to the selected node -->
  <g class="edge-strong">
    <line x1="480" y1="460" x2="240" y2="320"/>
    <line x1="240" y1="320" x2="170" y2="430"/>
  </g>

  <!-- nodes -->
  <g class="node-stroke">
    <circle class="node-fill-decision" cx="480" cy="460" r="28"/>

    <!-- Selected alternative -->
    <circle class="node-fill-alt node-selected" cx="240" cy="320" r="20"/>

    <circle class="node-fill-alt" cx="700" cy="320" r="16"/>
    <circle class="node-fill-alt" cx="480" cy="620" r="16"/>

    <circle class="node-fill-trade" cx="170" cy="430" r="12"/>
    <circle class="node-fill-trade" cx="820" cy="430" r="12"/>

    <circle class="node-fill-const" cx="330" cy="580" r="12"/>
    <circle class="node-fill-const" cx="760" cy="540" r="12"/>

    <circle class="node-fill-comp" cx="170" cy="270" r="11"/>
    <circle class="node-fill-comp" cx="820" cy="270" r="11"/>

    <circle class="node-fill-fail" cx="100" cy="500" r="10"/>
    <circle class="node-fill-fail" cx="880" cy="500" r="10"/>

    <circle class="node-fill-stake" cx="160" cy="630" r="10"/>
    <circle class="node-fill-stake" cx="800" cy="630" r="10"/>
  </g>

  <!-- node labels -->
  <text class="node-label" x="446" y="463">Adopt Postgres</text>
  <text class="node-label" x="208" y="295">Stay on Mongo</text>
  <text class="node-label" x="676" y="295">Aurora</text>

  <!-- right sidebar — selected node detail -->
  <rect class="sidebar" x="956" y="184" width="284" height="496" rx="8"/>
  <text class="text-label" x="972" y="206">SELECTED NODE</text>
  <text class="h-title"  x="972" y="234" style="font-size:18px;">Stay on Mongo</text>
  <text class="text-muted" x="972" y="254">Alternative · ent_8f4a91…</text>

  <text class="text-label" x="972" y="290">DESCRIPTION</text>
  <text class="text-body" x="972" y="312">Keep the existing sharded MongoDB</text>
  <text class="text-body" x="972" y="328">cluster and invest in stronger schema</text>
  <text class="text-body" x="972" y="344">enforcement at the application layer.</text>

  <text class="text-label" x="972" y="376">CONNECTED (2)</text>
  <text class="text-body" x="972" y="398">→ Adopt PostgreSQL  (PREFERRED_OVER)</text>
  <text class="text-body" x="972" y="416">→ operational complexity  (INVOLVES_TRADEOFF)</text>

  <text class="text-label" x="972" y="448">FLAGGED FAILURE MODES</text>
  <text class="text-body" x="972" y="470">• shard rebalancing during peak load</text>
  <text class="text-body" x="972" y="488">• analytics joins require app-side merge</text>

  <text class="text-label" x="972" y="520">REVIEWER COMMENTARY</text>
  <text class="text-body" x="972" y="542">SRE: "Operational complexity is the</text>
  <text class="text-body" x="972" y="560">binding constraint."</text>

  <rect x="972" y="600" width="248" height="36" rx="6" fill="#ea580c"/>
  <text x="1042" y="624" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Chat with SRE</text>
</svg>
