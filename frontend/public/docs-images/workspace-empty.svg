<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Quorum workspace empty-state mock">
  <title>Quorum workspace — empty state, ready to review an RFC</title>

  <defs>
    <style>
      .canvas { fill: #ffffff; stroke: #e5e7eb; }
      .chrome { fill: #f8fafc; stroke: #e2e8f0; }
      .pane   { fill: #f1f5f9; stroke: #e2e8f0; }
      .card   { fill: #ffffff; stroke: #e2e8f0; }
      .card-head { fill: #f8fafc; }
      .input  { fill: #ffffff; stroke: #cbd5e1; }
      .input-accent { fill: #fff7ed; stroke: #fed7aa; }
      .button { fill: #ea580c; }
      .text-title { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 600; }
      .text-h     { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; }
      .text-body  { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; }
      .text-muted { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10.5px; }
      .text-label { fill: #ea580c; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.12em; }
      .text-button { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; }
      .h-label { fill: #ea580c; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; }
      .h-title { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 22px; font-weight: 600; }
      .h-sub   { fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; }
      .dotted { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
    </style>
  </defs>

  <rect class="canvas" x="0.5" y="0.5" width="1279" height="719" rx="12"/>

  <text class="h-label" x="40" y="44">WORKSPACE — EMPTY</text>
  <text class="h-title" x="40" y="74">First visit: review an RFC</text>
  <text class="h-sub"   x="40" y="98">Default domain is engineering RFC. Drop in your design doc or describe the decision, then click Create.</text>

  <!-- browser-like app chrome -->
  <rect class="chrome" x="40" y="124" width="1200" height="48" rx="8"/>
  <circle cx="60" cy="148" r="4" fill="#cbd5e1"/>
  <circle cx="74" cy="148" r="4" fill="#cbd5e1"/>
  <circle cx="88" cy="148" r="4" fill="#cbd5e1"/>
  <text class="text-h" x="112" y="153">Quorum  ·  Workspace</text>
  <text class="text-body" x="1080" y="153">Docs</text>
  <text class="text-body" x="1130" y="153">New project</text>

  <!-- empty-state background pane -->
  <rect class="pane" x="40" y="184" width="1200" height="500" rx="8"/>

  <!-- form card, centered -->
  <g transform="translate(390,212)">
    <rect class="card" x="0.5" y="0.5" width="499" height="444" rx="10"/>

    <!-- card header -->
    <rect class="card-head" x="0.5" y="0.5" width="499" height="72" rx="10"/>
    <rect class="card-head" x="0.5" y="64" width="499" height="8"/>
    <text class="text-label" x="20" y="26">NEW PROJECT</text>
    <text class="text-title" x="20" y="52">Review an RFC</text>

    <!-- body -->
    <text class="text-label" x="20" y="100">DECISION</text>
    <rect class="input" x="20" y="108" width="459" height="80" rx="6"/>
    <text class="text-body" x="32" y="130">E.g. "Adopt PostgreSQL over MongoDB for the orders</text>
    <text class="text-body" x="32" y="148">service. 1-quarter migration budget, 5-min downtime</text>
    <text class="text-body" x="32" y="166">cap, analytics expects relational joins."</text>

    <text class="text-label" x="20" y="208">DOMAIN</text>
    <rect class="input" x="20" y="216" width="459" height="36" rx="6"/>
    <text class="text-h"    x="32" y="240">Engineering RFC / ADR</text>
    <path d="M 460 230 l 6 6 l 6 -6" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
    <text class="text-muted" x="20" y="270">Multi-disciplinary reviewer panel debates the decision and emits an ADR.</text>

    <text class="text-label" x="20" y="298">REALITY SEEDS (OPTIONAL)</text>
    <rect class="input-accent dotted" x="20" y="306" width="459" height="60" rx="6"/>
    <text class="text-body" x="172" y="330">Drop a PDF / Markdown / .txt design doc</text>
    <text class="text-muted" x="208" y="350">Up to 5 files, 8 MB each</text>

    <!-- button -->
    <rect class="button" x="20" y="386" width="459" height="40" rx="6"/>
    <text class="text-button" x="206" y="411">+ Create project</text>
  </g>

  <!-- footer caption -->
  <rect class="chrome" x="40" y="696" width="1200" height="0" rx="8"/>
  <text class="text-muted" x="40" y="708">The form is compact by design — it fits in any viewport without scrolling. The reviewer panel is convened the moment you click Create.</text>
</svg>
