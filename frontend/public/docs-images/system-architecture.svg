<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="Quorum system architecture diagram">
  <title>Quorum system architecture — client, backend, infrastructure</title>

  <defs>
    <style>
      .canvas { fill: #ffffff; stroke: #e5e7eb; }
      .lane   { fill: #f8fafc; stroke: #e2e8f0; }
      .lane-label { fill: #94a3b8; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; font-weight: 600; letter-spacing: 0.14em; }
      .node   { fill: #ffffff; stroke: #cbd5e1; }
      .node-title { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; }
      .node-sub   { fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; }
      .accent     { fill: #ea580c; }
      .node-accent { fill: #fff7ed; stroke: #fed7aa; }
      .h-label { fill: #ea580c; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; }
      .h-title { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 22px; font-weight: 600; }
      .h-sub   { fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; }
      .conn   { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
      .conn-dashed { stroke: #cbd5e1; stroke-width: 1.5; fill: none; stroke-dasharray: 4 4; }
      .edge-label { fill: #64748b; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; }
    </style>
    <marker id="arrowhead-arch" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cbd5e1"/>
    </marker>
  </defs>

  <rect class="canvas" x="0.5" y="0.5" width="1279" height="639" rx="12"/>

  <text class="h-label" x="40" y="44">ARCHITECTURE</text>
  <text class="h-title" x="40" y="74">Client · Backend · Infrastructure</text>
  <text class="h-sub"   x="40" y="98">Self-hosted three-layer stack. One FastAPI process owns the pipeline, the worker, and observability; persistence is JSON-in-Postgres.</text>

  <!-- ===== LANE 1: CLIENT ===== -->
  <rect class="lane" x="40" y="120" width="1200" height="100" rx="10"/>
  <text class="lane-label" x="56" y="138">CLIENT</text>

  <g transform="translate(64,150)">
    <rect class="node" x="0.5" y="0.5" width="280" height="58" rx="8"/>
    <text class="node-title" x="16" y="24">Next.js workspace</text>
    <text class="node-sub"   x="16" y="44">Project flow · live RFC graph · ADR view</text>
  </g>

  <g transform="translate(360,150)">
    <rect class="node" x="0.5" y="0.5" width="240" height="58" rx="8"/>
    <text class="node-title" x="16" y="24">Fumadocs docs site</text>
    <text class="node-sub"   x="16" y="44">/docs — concepts, API, deploy</text>
  </g>

  <g transform="translate(616,150)">
    <rect class="node" x="0.5" y="0.5" width="220" height="58" rx="8"/>
    <text class="node-title" x="16" y="24">pipeline-api.ts</text>
    <text class="node-sub"   x="16" y="44">Typed REST client (axios)</text>
  </g>

  <g transform="translate(852,150)">
    <rect class="node-accent" x="0.5" y="0.5" width="364" height="58" rx="8"/>
    <text class="node-title" x="16" y="24">Browser fetch <tspan class="accent">→</tspan> http://localhost:8000/api</text>
    <text class="node-sub"   x="16" y="44">Synchronous stage endpoints + async /pipeline/run-async</text>
  </g>

  <!-- ===== LANE 2: BACKEND ===== -->
  <rect class="lane" x="40" y="248" width="1200" height="200" rx="10"/>
  <text class="lane-label" x="56" y="266">BACKEND · FastAPI (Python 3.11)</text>

  <g transform="translate(64,280)">
    <rect class="node" x="0.5" y="0.5" width="280" height="156" rx="8"/>
    <text class="node-title" x="16" y="24">/api routes</text>
    <text class="node-sub"   x="16" y="46">POST /projects</text>
    <text class="node-sub"   x="16" y="62">POST /…/upload (de-id gate)</text>
    <text class="node-sub"   x="16" y="78">POST /…/graph/ontology/generate</text>
    <text class="node-sub"   x="16" y="94">POST /…/graph/build</text>
    <text class="node-sub"   x="16" y="110">POST /…/env/setup</text>
    <text class="node-sub"   x="16" y="126">POST /…/simulation/{prepare,activate,start}</text>
    <text class="node-sub"   x="16" y="142">POST /…/report/generate · /pipeline/run-async</text>
  </g>

  <g transform="translate(360,280)">
    <rect class="node-accent" x="0.5" y="0.5" width="240" height="74" rx="8"/>
    <text class="node-title" x="16" y="24">Domain registry</text>
    <text class="node-sub"   x="16" y="44">engineering_rfc (default) ·</text>
    <text class="node-sub"   x="16" y="60">general (LLM fallback)</text>
  </g>

  <g transform="translate(360,362)">
    <rect class="node" x="0.5" y="0.5" width="240" height="74" rx="8"/>
    <text class="node-title" x="16" y="24">Pipeline router</text>
    <text class="node-sub"   x="16" y="44">Project state machine,</text>
    <text class="node-sub"   x="16" y="60">per-project async lock</text>
  </g>

  <g transform="translate(616,280)">
    <rect class="node" x="0.5" y="0.5" width="220" height="74" rx="8"/>
    <text class="node-title" x="16" y="24">Async job worker</text>
    <text class="node-sub"   x="16" y="44">Drains jobs table —</text>
    <text class="node-sub"   x="16" y="60">durable, restart-safe</text>
  </g>

  <g transform="translate(616,362)">
    <rect class="node" x="0.5" y="0.5" width="220" height="74" rx="8"/>
    <text class="node-title" x="16" y="24">Observability</text>
    <text class="node-sub"   x="16" y="44">Structured logs · LLM</text>
    <text class="node-sub"   x="16" y="60">metrics per provider+stage</text>
  </g>

  <g transform="translate(852,280)">
    <rect class="node" x="0.5" y="0.5" width="364" height="74" rx="8"/>
    <text class="node-title" x="16" y="24">LLM abstraction (InstrumentedProvider)</text>
    <text class="node-sub"   x="16" y="44">Native JSON mode · token-budgeted prompts ·</text>
    <text class="node-sub"   x="16" y="60">retry-on-bad-JSON · per-stage tagging</text>
  </g>

  <g transform="translate(852,362)">
    <rect class="node" x="0.5" y="0.5" width="364" height="74" rx="8"/>
    <text class="node-title" x="16" y="24">De-identification gate</text>
    <text class="node-sub"   x="16" y="44">Regex PHI scan at upload — off | warn |</text>
    <text class="node-sub"   x="16" y="60">strict | redact (configurable via DEID_MODE)</text>
  </g>

  <!-- ===== LANE 3: INFRASTRUCTURE ===== -->
  <rect class="lane" x="40" y="476" width="1200" height="140" rx="10"/>
  <text class="lane-label" x="56" y="494">INFRASTRUCTURE</text>

  <g transform="translate(64,508)">
    <rect class="node" x="0.5" y="0.5" width="280" height="92" rx="8"/>
    <text class="node-title" x="16" y="24">PostgreSQL</text>
    <text class="node-sub"   x="16" y="46">projects (JSON document per row)</text>
    <text class="node-sub"   x="16" y="62">jobs (durable queue)</text>
    <text class="node-sub"   x="16" y="78">Alembic-managed schema; SQLite fallback for dev</text>
  </g>

  <g transform="translate(360,508)">
    <rect class="node" x="0.5" y="0.5" width="240" height="92" rx="8"/>
    <text class="node-title" x="16" y="24">SQLAlchemy 2.x</text>
    <text class="node-sub"   x="16" y="46">Connection pool</text>
    <text class="node-sub"   x="16" y="62">FOR UPDATE SKIP LOCKED</text>
    <text class="node-sub"   x="16" y="78">on Postgres for job claims</text>
  </g>

  <g transform="translate(616,508)">
    <rect class="node" x="0.5" y="0.5" width="220" height="92" rx="8"/>
    <text class="node-title" x="16" y="24">Evaluation harness</text>
    <text class="node-sub"   x="16" y="46">Curated case suite</text>
    <text class="node-sub"   x="16" y="62">Rubric scoring</text>
    <text class="node-sub"   x="16" y="78">python -m quorum_backend.eval</text>
  </g>

  <g transform="translate(852,508)">
    <rect class="node-accent" x="0.5" y="0.5" width="364" height="92" rx="8"/>
    <text class="node-title" x="16" y="24">LLM providers (one selected via LLM_PROVIDER)</text>
    <text class="node-sub"   x="16" y="46">Google Gemini · Anthropic Claude ·</text>
    <text class="node-sub"   x="16" y="62">Azure AI Foundry · Local deterministic stub (tests)</text>
    <text class="node-sub"   x="16" y="78">Per-provider rate limit + transient-error retry</text>
  </g>

  <!-- Connectors -->
  <path class="conn" d="M 480 210 L 480 248" marker-end="url(#arrowhead-arch)"/>
  <path class="conn" d="M 950 210 L 950 248" marker-end="url(#arrowhead-arch)"/>

  <path class="conn" d="M 344 318 L 360 318" marker-end="url(#arrowhead-arch)"/>
  <path class="conn" d="M 344 400 L 360 400" marker-end="url(#arrowhead-arch)"/>
  <path class="conn" d="M 600 318 L 616 318" marker-end="url(#arrowhead-arch)"/>
  <path class="conn" d="M 600 400 L 616 400" marker-end="url(#arrowhead-arch)"/>
  <path class="conn" d="M 836 318 L 852 318" marker-end="url(#arrowhead-arch)"/>
  <path class="conn" d="M 836 400 L 852 400" marker-end="url(#arrowhead-arch)"/>

  <path class="conn" d="M 204 437 L 204 508" marker-end="url(#arrowhead-arch)"/>
  <path class="conn" d="M 480 437 L 480 508" marker-end="url(#arrowhead-arch)"/>
  <path class="conn-dashed" d="M 1034 437 L 1034 508" marker-end="url(#arrowhead-arch)"/>

  <text class="edge-label" x="1044" y="475">JSON-mode LLM call</text>
</svg>
