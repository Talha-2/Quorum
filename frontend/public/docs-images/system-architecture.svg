<svg width="1400" height="860" viewBox="0 0 1400 860" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1400" height="860" rx="32" fill="#F6F2EA"/>
  <rect x="44" y="44" width="1312" height="772" rx="28" fill="#FFFDF9" stroke="#D9D0C2" stroke-width="2"/>
  <text x="76" y="108" fill="#1E1A16" font-family="Arial, sans-serif" font-size="34" font-weight="700">Quorum System Architecture</text>
  <text x="76" y="144" fill="#6C6358" font-family="Arial, sans-serif" font-size="18">Single production path: workspace UI, project router, per-stage services, persistence, provider abstraction</text>

  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#B6AA97" flood-opacity="0.18"/>
    </filter>
    <marker id="archArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12V0Z" fill="#735128"/>
    </marker>
  </defs>

  <g filter="url(#soft)">
    <rect x="86" y="208" width="260" height="180" rx="24" fill="#F6E7CC" stroke="#D09B45" stroke-width="2"/>
    <text x="116" y="252" fill="#8C5B1D" font-family="Arial, sans-serif" font-size="22" font-weight="700">Browser</text>
    <text x="116" y="290" fill="#1E1A16" font-family="Arial, sans-serif" font-size="28" font-weight="700">Operator</text>
    <text x="116" y="326" fill="#5E5447" font-family="Arial, sans-serif" font-size="16">Uses the workspace, graph,</text>
    <text x="116" y="348" fill="#5E5447" font-family="Arial, sans-serif" font-size="16">agent gallery, and docs</text>
    <rect x="116" y="370" width="190" height="34" rx="10" fill="#FFF7E9"/>
    <text x="132" y="393" fill="#8A5B22" font-family="Arial, sans-serif" font-size="15" font-weight="700">/workspace and /docs</text>

    <rect x="420" y="150" width="330" height="300" rx="24" fill="#E6EFF9" stroke="#5B88B7" stroke-width="2"/>
    <text x="452" y="194" fill="#2D5886" font-family="Arial, sans-serif" font-size="22" font-weight="700">Frontend</text>
    <text x="452" y="232" fill="#1E1A16" font-family="Arial, sans-serif" font-size="30" font-weight="700">Next.js 14</text>
    <text x="452" y="270" fill="#5E5447" font-family="Arial, sans-serif" font-size="16">Active workspace implementation</text>
    <rect x="452" y="296" width="266" height="40" rx="12" fill="#F7FAFD"/>
    <text x="470" y="321" fill="#2C5D8C" font-family="Arial, sans-serif" font-size="15" font-weight="700">components/workspace/quorum-pipeline.tsx</text>
    <rect x="452" y="350" width="266" height="40" rx="12" fill="#F7FAFD"/>
    <text x="470" y="375" fill="#2C5D8C" font-family="Arial, sans-serif" font-size="15" font-weight="700">content/docs/* powered by Fumadocs</text>
    <rect x="452" y="404" width="266" height="26" rx="10" fill="#D7E6F5"/>
    <text x="470" y="422" fill="#355A7D" font-family="Arial, sans-serif" font-size="14">REST client, graph rendering, stage cards</text>

    <rect x="800" y="120" width="360" height="360" rx="24" fill="#E8F4EB" stroke="#4C9567" stroke-width="2"/>
    <text x="832" y="164" fill="#27653F" font-family="Arial, sans-serif" font-size="22" font-weight="700">Backend</text>
    <text x="832" y="202" fill="#1E1A16" font-family="Arial, sans-serif" font-size="30" font-weight="700">FastAPI Project Router</text>
    <text x="832" y="238" fill="#5E5447" font-family="Arial, sans-serif" font-size="16">backend/main.py mounts one production pipeline</text>
    <rect x="832" y="266" width="296" height="42" rx="12" fill="#F8FCF9"/>
    <text x="850" y="292" fill="#2B6B43" font-family="Arial, sans-serif" font-size="15" font-weight="700">pipeline/router.py: ordering, locking, persistence</text>
    <rect x="832" y="322" width="296" height="42" rx="12" fill="#F8FCF9"/>
    <text x="850" y="348" fill="#2B6B43" font-family="Arial, sans-serif" font-size="15" font-weight="700">stage services: ontology, graph, env, config, activation</text>
    <rect x="832" y="378" width="296" height="42" rx="12" fill="#F8FCF9"/>
    <text x="850" y="404" fill="#2B6B43" font-family="Arial, sans-serif" font-size="15" font-weight="700">simulation runner, consensus, report generator, agent chat</text>
    <rect x="832" y="434" width="296" height="26" rx="10" fill="#D9EEDD"/>
    <text x="850" y="452" fill="#315E40" font-family="Arial, sans-serif" font-size="14">per-project lock + persisted project artifacts</text>

    <rect x="420" y="540" width="330" height="190" rx="24" fill="#F8E8EF" stroke="#BE5C7A" stroke-width="2"/>
    <text x="452" y="584" fill="#8A3354" font-family="Arial, sans-serif" font-size="22" font-weight="700">Persistence</text>
    <text x="452" y="622" fill="#1E1A16" font-family="Arial, sans-serif" font-size="30" font-weight="700">Local Project Store</text>
    <text x="452" y="658" fill="#5E5447" font-family="Arial, sans-serif" font-size="16">In-memory state plus atomic pickle writes</text>
    <rect x="452" y="684" width="220" height="30" rx="10" fill="#FFF7FA"/>
    <text x="468" y="704" fill="#8B3B59" font-family="Arial, sans-serif" font-size="14" font-weight="700">backend/.quorum_projects.pkl or configured path</text>

    <rect x="800" y="560" width="360" height="170" rx="24" fill="#F3ECFB" stroke="#7D59B6" stroke-width="2"/>
    <text x="832" y="604" fill="#5B3C8E" font-family="Arial, sans-serif" font-size="22" font-weight="700">LLM Layer</text>
    <text x="832" y="642" fill="#1E1A16" font-family="Arial, sans-serif" font-size="30" font-weight="700">Provider Abstraction</text>
    <text x="832" y="678" fill="#5E5447" font-family="Arial, sans-serif" font-size="16">Google Gemini, Claude, Azure AI Foundry, local deterministic provider</text>
    <rect x="832" y="700" width="280" height="18" rx="8" fill="#E6D9F8"/>
  </g>

  <path d="M346 298H420" stroke="#735128" stroke-width="4" marker-end="url(#archArrow)"/>
  <path d="M750 300H800" stroke="#735128" stroke-width="4" marker-end="url(#archArrow)"/>
  <path d="M965 480V520" stroke="#735128" stroke-width="4" marker-end="url(#archArrow)"/>
  <path d="M905 480C905 550 716 495 660 540" stroke="#735128" stroke-width="4" marker-end="url(#archArrow)"/>
  <path d="M585 450V540" stroke="#735128" stroke-width="4" marker-end="url(#archArrow)"/>

  <rect x="86" y="540" width="260" height="190" rx="24" fill="#FFF5DF" stroke="#D3A248" stroke-width="2"/>
  <text x="116" y="584" fill="#8A601D" font-family="Arial, sans-serif" font-size="22" font-weight="700">Operational Notes</text>
  <text x="116" y="622" fill="#5E5447" font-family="Arial, sans-serif" font-size="16">• one canonical API surface</text>
  <text x="116" y="648" fill="#5E5447" font-family="Arial, sans-serif" font-size="16">• uploads freeze once stages begin</text>
  <text x="116" y="674" fill="#5E5447" font-family="Arial, sans-serif" font-size="16">• stage outputs are queryable by project</text>
  <text x="116" y="700" fill="#5E5447" font-family="Arial, sans-serif" font-size="16">• /health exposes provider and store state</text>
</svg>
