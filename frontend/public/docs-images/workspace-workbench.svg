<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Quorum workbench screen mock">
  <title>Quorum workbench — live RFC graph on the left, stage cards on the right, event log below</title>

  <defs>
    <style>
      .canvas { fill: #ffffff; stroke: #e5e7eb; }
      .chrome { fill: #f8fafc; stroke: #e2e8f0; }
      .pane   { fill: #f8fafc; stroke: #e2e8f0; }
      .card   { fill: #ffffff; stroke: #e2e8f0; }
      .card-done { fill: #fff7ed; stroke: #fed7aa; }
      .card-active { fill: #ffffff; stroke: #ea580c; stroke-width: 1.5; }
      .text-h     { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; }
      .text-body  { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; }
      .text-muted { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10.5px; }
      .text-label { fill: #ea580c; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.12em; }
      .text-stage { fill: #ea580c; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; }
      .h-label { fill: #ea580c; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; }
      .h-title { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 22px; font-weight: 600; }
      .h-sub   { fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; }
      .edge   { stroke: #cbd5e1; stroke-width: 1.25; fill: none; }
      .node-fill-decision { fill: #ea580c; }
      .node-fill-alt   { fill: #38bdf8; }
      .node-fill-trade { fill: #a78bfa; }
      .node-fill-const { fill: #facc15; }
      .node-fill-comp  { fill: #34d399; }
      .node-fill-rev   { fill: #f472b6; }
      .node-stroke { stroke: #ffffff; stroke-width: 1.5; }
      .log-strip { fill: #0f172a; }
      .log-ts { fill: #94a3b8; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; }
      .log-info { fill: #cbd5e1; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; }
      .log-ok { fill: #4ade80; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; }
    </style>
  </defs>

  <rect class="canvas" x="0.5" y="0.5" width="1279" height="719" rx="12"/>

  <text class="h-label" x="40" y="44">WORKSPACE — WORKBENCH</text>
  <text class="h-title" x="40" y="74">Live RFC graph · sequential stage cards · event log</text>
  <text class="h-sub"   x="40" y="98">Three views: Workbench (here), Graph (full-screen), Agents (panel gallery). Pipeline runs one stage at a time; each output is inspectable.</text>

  <!-- chrome -->
  <rect class="chrome" x="40" y="124" width="1200" height="48" rx="8"/>
  <text class="text-h"     x="56" y="153">Quorum — Adopt PostgreSQL over MongoDB</text>
  <text class="text-muted" x="980" y="153">Workbench · Graph · Agents · New project</text>

  <!-- two-column body: graph left, stages right -->
  <rect class="pane" x="40" y="184" width="780" height="440" rx="8"/>
  <rect class="pane" x="836" y="184" width="404" height="440" rx="8"/>

  <text class="text-label" x="56" y="206">RFC GRAPH (live)</text>
  <text class="text-label" x="852" y="206">PIPELINE STAGES</text>

  <!-- ============ GRAPH ============ -->
  <!-- edges -->
  <g class="edge">
    <line x1="430" y1="380" x2="220" y2="280"/>
    <line x1="430" y1="380" x2="290" y2="470"/>
    <line x1="430" y1="380" x2="610" y2="280"/>
    <line x1="430" y1="380" x2="640" y2="500"/>
    <line x1="430" y1="380" x2="430" y2="540"/>
    <line x1="220" y1="280" x2="160" y2="380"/>
    <line x1="610" y1="280" x2="700" y2="380"/>
    <line x1="290" y1="470" x2="430" y2="540"/>
    <line x1="640" y1="500" x2="430" y2="540"/>
    <line x1="220" y1="280" x2="430" y2="380"/>
    <line x1="610" y1="280" x2="610" y2="380"/>
    <line x1="160" y1="380" x2="290" y2="470"/>
  </g>

  <!-- nodes -->
  <g class="node-stroke">
    <!-- central decision -->
    <circle class="node-fill-decision" cx="430" cy="380" r="22"/>

    <!-- alternatives -->
    <circle class="node-fill-alt" cx="220" cy="280" r="14"/>
    <circle class="node-fill-alt" cx="610" cy="280" r="14"/>
    <circle class="node-fill-alt" cx="430" cy="540" r="14"/>

    <!-- trade-offs -->
    <circle class="node-fill-trade" cx="160" cy="380" r="10"/>
    <circle class="node-fill-trade" cx="700" cy="380" r="10"/>

    <!-- constraints -->
    <circle class="node-fill-const" cx="290" cy="470" r="10"/>
    <circle class="node-fill-const" cx="640" cy="500" r="10"/>

    <!-- components -->
    <circle class="node-fill-comp" cx="610" cy="380" r="9"/>

    <!-- reviewers (panel) on the perimeter -->
    <circle class="node-fill-rev" cx="120" cy="240" r="8"/>
    <circle class="node-fill-rev" cx="730" cy="230" r="8"/>
    <circle class="node-fill-rev" cx="710" cy="560" r="8"/>
    <circle class="node-fill-rev" cx="180" cy="540" r="8"/>
  </g>

  <text class="text-muted" x="450" y="385">Adopt PostgreSQL</text>
  <text class="text-muted" x="240" y="285">Stay on Mongo</text>
  <text class="text-muted" x="630" y="285">Aurora</text>

  <!-- graph legend -->
  <g transform="translate(56,576)">
    <circle class="node-fill-decision" cx="6" cy="0" r="4"/><text class="text-muted" x="16" y="4">Decision</text>
    <circle class="node-fill-alt" cx="90" cy="0" r="4"/><text class="text-muted" x="100" y="4">Alternative</text>
    <circle class="node-fill-trade" cx="190" cy="0" r="4"/><text class="text-muted" x="200" y="4">Tradeoff</text>
    <circle class="node-fill-const" cx="280" cy="0" r="4"/><text class="text-muted" x="290" y="4">Constraint</text>
    <circle class="node-fill-comp" cx="380" cy="0" r="4"/><text class="text-muted" x="390" y="4">Component</text>
    <circle class="node-fill-rev" cx="490" cy="0" r="4"/><text class="text-muted" x="500" y="4">Reviewer</text>
  </g>

  <!-- ============ STAGE CARDS ============ -->
  <g transform="translate(852,222)">
    <!-- 01 done -->
    <rect class="card-done" x="0.5" y="0.5" width="372" height="48" rx="6"/>
    <text class="text-stage" x="14" y="20">01</text>
    <text class="text-h"     x="40" y="20">Apply ontology</text>
    <text class="text-muted" x="40" y="38">10 entity types · 10 edge types</text>
    <text class="text-muted" x="332" y="20">✓</text>

    <!-- 02 done -->
    <rect class="card-done" x="0.5" y="56.5" width="372" height="48" rx="6"/>
    <text class="text-stage" x="14" y="76">02</text>
    <text class="text-h"     x="40" y="76">Build RFC graph</text>
    <text class="text-muted" x="40" y="94">14 nodes · 21 edges</text>
    <text class="text-muted" x="332" y="76">✓</text>

    <!-- 03 done -->
    <rect class="card-done" x="0.5" y="112.5" width="372" height="48" rx="6"/>
    <text class="text-stage" x="14" y="132">03</text>
    <text class="text-h"     x="40" y="132">Convene panel</text>
    <text class="text-muted" x="40" y="150">7-seat reviewer roster</text>
    <text class="text-muted" x="332" y="132">✓</text>

    <!-- 04 active -->
    <rect class="card-active" x="0.5" y="168.5" width="372" height="64" rx="6"/>
    <text class="text-stage" x="14" y="190">04</text>
    <text class="text-h"     x="40" y="190">Calibrate</text>
    <text class="text-muted" x="40" y="208">Per-seat mandates</text>
    <text class="text-body" x="40" y="224">Running…</text>
    <rect x="332" y="184" width="28" height="14" rx="3" fill="#ea580c"/>
    <text class="text-muted" x="338" y="195" style="fill:#ffffff;">▶</text>

    <!-- 05 pending -->
    <rect class="card" x="0.5" y="240.5" width="372" height="48" rx="6"/>
    <text class="text-stage" x="14" y="260">05</text>
    <text class="text-h"     x="40" y="260">Open review</text>
    <text class="text-muted" x="40" y="278">Seed the panel with the decision</text>

    <!-- 06 pending -->
    <rect class="card" x="0.5" y="296.5" width="372" height="48" rx="6"/>
    <text class="text-stage" x="14" y="316">06</text>
    <text class="text-h"     x="40" y="316">Run deliberation</text>
    <text class="text-muted" x="40" y="334">Rounds + Skeptic cross-exam</text>

    <!-- 07 pending -->
    <rect class="card" x="0.5" y="352.5" width="372" height="48" rx="6"/>
    <text class="text-stage" x="14" y="372">07</text>
    <text class="text-h"     x="40" y="372">Emit ADR</text>
    <text class="text-muted" x="40" y="390">Eight-section Markdown</text>
  </g>

  <!-- event log strip -->
  <rect class="log-strip" x="40" y="640" width="1200" height="60" rx="8"/>
  <text class="log-ts"   x="56" y="664">17:42:11</text>
  <text class="log-ok"   x="120" y="664">ontology</text>
  <text class="log-info" x="200" y="664">Applied fixed engineering_rfc ontology — 10 entity types, 10 edge types</text>
  <text class="log-ts"   x="56" y="684">17:42:14</text>
  <text class="log-ok"   x="120" y="684">env</text>
  <text class="log-info" x="200" y="684">Convened the 7-seat Engineering RFC / ADR panel — Principal Eng, SRE, Security, Cost, Product, Tech Lead, Skeptic</text>
</svg>
