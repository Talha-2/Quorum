<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" role="img" aria-label="Quorum pipeline flow chart">
  <title>Quorum pipeline — seven stages from decision to ADR</title>

  <defs>
    <style>
      .canvas { fill: #ffffff; stroke: #e5e7eb; }
      .card-bg { fill: #f8fafc; stroke: #e2e8f0; }
      .card-stripe { fill: #ea580c; }
      .stage-num { fill: #ea580c; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; }
      .stage-title { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; }
      .stage-body { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; }
      .h-label { fill: #ea580c; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; }
      .h-title { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 22px; font-weight: 600; }
      .h-sub   { fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; }
      .caption { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
      .caption-bold { font-weight: 600; fill: #0f172a; }
      .arrow { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
      .legend-text { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cbd5e1"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect class="canvas" x="0.5" y="0.5" width="1279" height="439" rx="12"/>

  <!-- header -->
  <text class="h-label" x="40" y="44">PIPELINE</text>
  <text class="h-title" x="40" y="74">From decision to signed-off ADR in seven stages</text>
  <text class="h-sub"   x="40" y="98">Each stage validates its prerequisites, persists its output, and exposes intermediate state to debug a review without guessing.</text>

  <!-- 7 stage cards. Card box = 160x148, gap = 16. -->
  <!-- 01 -->
  <g transform="translate(40,130)">
    <rect class="card-bg" x="0.5" y="0.5" width="159" height="147" rx="8"/>
    <rect class="card-stripe" x="0" y="0" width="3" height="148" rx="1.5"/>
    <text class="stage-num"  x="14" y="22">01</text>
    <text class="stage-title" x="14" y="46">Apply ontology</text>
    <text class="stage-body" x="14" y="74">Topic-specific entity</text>
    <text class="stage-body" x="14" y="90">and edge schema —</text>
    <text class="stage-body" x="14" y="106">fixed for the</text>
    <text class="stage-body" x="14" y="122">RFC domain.</text>
  </g>
  <!-- 02 -->
  <g transform="translate(216,130)">
    <rect class="card-bg" x="0.5" y="0.5" width="159" height="147" rx="8"/>
    <rect class="card-stripe" x="0" y="0" width="3" height="148" rx="1.5"/>
    <text class="stage-num"  x="14" y="22">02</text>
    <text class="stage-title" x="14" y="46">Build graph</text>
    <text class="stage-body" x="14" y="74">Decisions, alternatives,</text>
    <text class="stage-body" x="14" y="90">trade-offs, constraints,</text>
    <text class="stage-body" x="14" y="106">stakeholders, failure</text>
    <text class="stage-body" x="14" y="122">modes — typed.</text>
  </g>
  <!-- 03 -->
  <g transform="translate(392,130)">
    <rect class="card-bg" x="0.5" y="0.5" width="159" height="147" rx="8"/>
    <rect class="card-stripe" x="0" y="0" width="3" height="148" rx="1.5"/>
    <text class="stage-num"  x="14" y="22">03</text>
    <text class="stage-title" x="14" y="46">Convene panel</text>
    <text class="stage-body" x="14" y="74">Seven-seat standing</text>
    <text class="stage-body" x="14" y="90">reviewer roster —</text>
    <text class="stage-body" x="14" y="106">principal eng, SRE,</text>
    <text class="stage-body" x="14" y="122">security, cost, …</text>
  </g>
  <!-- 04 -->
  <g transform="translate(568,130)">
    <rect class="card-bg" x="0.5" y="0.5" width="159" height="147" rx="8"/>
    <rect class="card-stripe" x="0" y="0" width="3" height="148" rx="1.5"/>
    <text class="stage-num"  x="14" y="22">04</text>
    <text class="stage-title" x="14" y="46">Calibrate</text>
    <text class="stage-body" x="14" y="74">Per-seat mandates so</text>
    <text class="stage-body" x="14" y="90">security speaks on</text>
    <text class="stage-body" x="14" y="106">threats, cost on TCO,</text>
    <text class="stage-body" x="14" y="122">SRE on blast radius.</text>
  </g>
  <!-- 05 -->
  <g transform="translate(744,130)">
    <rect class="card-bg" x="0.5" y="0.5" width="159" height="147" rx="8"/>
    <rect class="card-stripe" x="0" y="0" width="3" height="148" rx="1.5"/>
    <text class="stage-num"  x="14" y="22">05</text>
    <text class="stage-title" x="14" y="46">Open review</text>
    <text class="stage-body" x="14" y="74">Seed the panel with</text>
    <text class="stage-body" x="14" y="90">the decision and the</text>
    <text class="stage-body" x="14" y="106">trade-offs the brief</text>
    <text class="stage-body" x="14" y="122">exposes.</text>
  </g>
  <!-- 06 -->
  <g transform="translate(920,130)">
    <rect class="card-bg" x="0.5" y="0.5" width="159" height="147" rx="8"/>
    <rect class="card-stripe" x="0" y="0" width="3" height="148" rx="1.5"/>
    <text class="stage-num"  x="14" y="22">06</text>
    <text class="stage-title" x="14" y="46">Run deliberation</text>
    <text class="stage-body" x="14" y="74">Round-by-round debate.</text>
    <text class="stage-body" x="14" y="90">Skeptic attacks the</text>
    <text class="stage-body" x="14" y="106">leading argument at</text>
    <text class="stage-body" x="14" y="122">the end of each round.</text>
  </g>
  <!-- 07 -->
  <g transform="translate(1096,130)">
    <rect class="card-bg" x="0.5" y="0.5" width="143" height="147" rx="8"/>
    <rect class="card-stripe" x="0" y="0" width="3" height="148" rx="1.5"/>
    <text class="stage-num"  x="14" y="22">07</text>
    <text class="stage-title" x="14" y="46">Emit ADR</text>
    <text class="stage-body" x="14" y="74">Eight-section Markdown</text>
    <text class="stage-body" x="14" y="90">— decision, why-not,</text>
    <text class="stage-body" x="14" y="106">dissents, consequences,</text>
    <text class="stage-body" x="14" y="122">follow-ups.</text>
  </g>

  <!-- arrows between stages (between cards, y center = 204) -->
  <line class="arrow" x1="200" y1="204" x2="216" y2="204" marker-end="url(#arrowhead)"/>
  <line class="arrow" x1="376" y1="204" x2="392" y2="204" marker-end="url(#arrowhead)"/>
  <line class="arrow" x1="552" y1="204" x2="568" y2="204" marker-end="url(#arrowhead)"/>
  <line class="arrow" x1="728" y1="204" x2="744" y2="204" marker-end="url(#arrowhead)"/>
  <line class="arrow" x1="904" y1="204" x2="920" y2="204" marker-end="url(#arrowhead)"/>
  <line class="arrow" x1="1080" y1="204" x2="1096" y2="204" marker-end="url(#arrowhead)"/>

  <!-- domain caption band -->
  <rect x="40" y="312" width="1200" height="88" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text class="h-label" x="56" y="334">ENGINEERING RFC DOMAIN</text>
  <text class="caption" x="56" y="358"><tspan class="caption-bold">Fixed</tspan> ontology (01), reviewer roster (03), and ADR outline (07) ship as Python constants — no LLM call, deterministic, auditable.</text>
  <text class="caption" x="56" y="376"><tspan class="caption-bold">Skipped</tspan> for fixed rosters: stages 04 (sim config) and 05 (activation) — the brief itself is the activation; the panel doesn’t need a “narrative direction”.</text>
  <text class="caption" x="56" y="394"><tspan class="caption-bold">Full panel</tspan> speaks every round in 06, then the <tspan class="caption-bold">Skeptic</tspan> seat runs a dedicated cross-examination attacking the round’s leading argument.</text>
</svg>
