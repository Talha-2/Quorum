[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quorum-backend"
version = "0.1.0"
description = "Quorum backend — FastAPI + multi-agent reasoning pipeline"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Quorum contributors" }]
dependencies = [
  "fastapi==0.121.2",
  "uvicorn==0.32.1",
  "python-multipart==0.0.27",
  "pydantic==2.11.10",
  "pydantic-settings==2.6.1",
  "python-dotenv==1.2.2",
  "google-generativeai==0.8.6",
  "anthropic==0.25.0",
  "openai==2.31.0",
  "pypdf==6.10.2",
  "networkx==3.2.1",
  "sqlalchemy==2.0.36",
  "alembic==1.14.0",
  "psycopg2-binary==2.9.10",
  "urllib3>=2.7.0",
  # Forced transitive bumps to clear known CVEs in deps of our direct pins.
  "starlette>=0.47.2",
  "idna>=3.15",
  "mako>=1.3.12",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "pip-audit==2.7.3",
]

[project.urls]
Homepage = "https://github.com/Talha-2/Quorum"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

