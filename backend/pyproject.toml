[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quorum-backend"
version = "0.1.0"
description = "Quorum backend — FastAPI + multi-agent reasoning pipeline"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Quorum contributors" }]
dependencies = [
  "fastapi==0.115.6",
  "uvicorn==0.32.1",
  "python-multipart==0.0.20",
  "pydantic==2.11.10",
  "pydantic-settings==2.6.1",
  "python-dotenv==1.0.0",
  "google-generativeai==0.8.6",
  "anthropic==0.25.0",
  "openai==2.31.0",
  "pypdf==6.10.0",
  "networkx==3.2.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.1.1",
]

[project.urls]
Homepage = "https://github.com/Talha-2/Quorum"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

