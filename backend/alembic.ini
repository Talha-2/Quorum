# Alembic configuration for manual CLI use:
#   cd backend && alembic upgrade head
#
# The application itself runs migrations programmatically at startup
# (quorum_backend.pipeline.db.init_db), so this file is only needed when
# running the `alembic` command by hand.
#
# sqlalchemy.url is intentionally left blank: env.py falls back to the
# application's resolved DATABASE_URL when no url is set here.

[alembic]
script_location = src/quorum_backend/migrations
prepend_sys_path = src
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
