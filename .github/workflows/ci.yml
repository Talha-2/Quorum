name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quorum
          POSTGRES_PASSWORD: quorum
          POSTGRES_DB: quorum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quorum"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]"
      - name: Pytest
        env:
          DATABASE_URL: postgresql+psycopg2://quorum:quorum@localhost:5432/quorum
        run: |
          pytest -q backend/tests
      - name: Security audit (Python deps)
        # --skip-editable skips the locally installed quorum-backend package
        # itself (it's not on PyPI). Fails on any known CVE in our deps.
        #
        # Ignored: MAL-2026-4750 — OSV malicious-packages flag against the
        # legitimate `fastapi` package with no fix version listed; treated
        # as a false positive against the official tiangolo/fastapi release.
        # Revisit when the OSV advisory is withdrawn or a fix lands.
        run: |
          pip-audit --skip-editable --ignore-vuln MAL-2026-4750

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run build
      - name: Security audit (npm deps)
        # Fails on critical advisories only. The current high-severity findings
        # are in postcss bundled inside Next 14's own node_modules — build-time
        # only, no runtime exposure — and clear when we upgrade to Next 15+.
        working-directory: frontend
        run: npm audit --audit-level=critical

